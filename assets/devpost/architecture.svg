    <g transform="translate(420 245)"><rect width="285" height="145" rx="20" fill="#122e3c" stroke="#6ee4ff" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#6ee4ff"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#09202b">2</text><text x="80" y="39" font-size="22" font-weight="800" fill="#fff">ENVIRONMENT DEPTH</text><text x="80" y="66" font-size="22" font-weight="800" fill="#fff">RAYCAST</text><text x="28" y="101" font-size="16" fill="#c8e6f0">Measured hit when available;</text><text x="28" y="124" font-size="16" fill="#c8e6f0">otherwise 1.5 m fallback</text></g>
    <g transform="translate(755 245)"><rect width="300" height="145" rx="20" fill="#122e3c" stroke="#6ee4ff" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#6ee4ff"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#09202b">3</text><text x="80" y="39" font-size="22" font-weight="800" fill="#fff">WORLD TARGET</text><text x="80" y="66" font-size="22" font-weight="800" fill="#fff">+ ANALYZING CARD</text><text x="28" y="105" font-size="17" fill="#c8e6f0">Session world space</text></g>
    <g transform="translate(755 470)"><rect width="300" height="145" rx="20" fill="#122e3c" stroke="#6ee4ff" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#6ee4ff"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#09202b">4</text><text x="80" y="39" font-size="22" font-weight="800" fill="#fff">QUEST RGB CROP</text><text x="80" y="66" font-size="22" font-weight="800" fill="#fff">+ JPEG</text><text x="28" y="101" font-size="16" fill="#c8e6f0">PassthroughCameraAccess;</text><text x="28" y="124" font-size="16" fill="#c8e6f0">project target into frame</text></g>
    <g transform="translate(1184 270)"><rect width="310" height="182" rx="20" fill="#382817" stroke="#ffc45e" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#ffc45e"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#30200b">5</text><text x="80" y="40" font-size="24" font-weight="800" fill="#fff">MOONDREAM</text><text x="80" y="69" font-size="24" font-weight="800" fill="#fff">+ OLLAMA</text><text x="28" y="112" font-size="17" fill="#f4ddba">Generative vision model</text><text x="28" y="138" font-size="17" fill="#f4ddba">runs locally on laptop</text></g>
    <g transform="translate(1184 520)"><rect width="310" height="182" rx="20" fill="#382817" stroke="#ffc45e" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#ffc45e"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#30200b">6</text><text x="80" y="40" font-size="22" font-weight="800" fill="#fff">NORMALIZED NOUN</text><text x="80" y="68" font-size="22" font-weight="800" fill="#fff">+ FR / ES LOOKUP</text><text x="28" y="112" font-size="17" fill="#f4ddba">Normalize response;</text><text x="28" y="138" font-size="17" fill="#f4ddba">look up translations locally</text></g>
    <g transform="translate(100 500)"><rect width="560" height="150" rx="22" fill="#103849" stroke="#7be9ff" stroke-width="3"/><circle cx="46" cy="45" r="25" fill="#7be9ff"/><text x="46" y="54" text-anchor="middle" font-size="23" font-weight="800" fill="#09202b">7</text><text x="90" y="46" font-size="25" font-weight="800" fill="#fff">UPDATE THE ORIGINAL</text><text x="90" y="77" font-size="25" font-weight="800" fill="#fff">SPATIAL CARD</text><text x="30" y="112" font-size="17" fill="#d5f1f7">Each asynchronous response keeps the renderer</text><text x="30" y="136" font-size="17" fill="#d5f1f7">handle from its own pinch.</text></g>
